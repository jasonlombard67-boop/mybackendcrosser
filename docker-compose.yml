version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env          # ← create this from server/.env.example
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy (uncomment if you want HTTPS termination)
